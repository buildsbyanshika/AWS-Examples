AWSTemplateFormatVersion: "2010-09-09"
Description: "Create a Network ACLs Instance"
Parameters:
    VpcId:
      Type: String
      Default: vpc-07fbfb2dea87d4307
    SubnetId:
      Type: String
      Default: subnet-0160df65b3cb8f489
    InstanceType:
      Type: String
      Default: t3.micro
    ImageId:
      Type: String
      Default: ami-052190d76c25f66d1
Resources:
  SSMRole:
    Type: "AWS::IAM::Role"
    Properties: 
      AssumeRolePolicyDocument: 
        Version: "2012-10-17"
        Statement: 
          - Effect: "Allow"
            Principal: 
              Service: 
                - "ec2.amazonaws.com"
            Action: 
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
  EC2InstanceProfile: 
    Type: "AWS::IAM::InstanceProfile"
    Properties: 
      # Path: "/"
      Roles: 
        - !Ref SSMRole
  MyEC2Instance: 
    Type: AWS::EC2::Instance
    Properties: 
          IamInstanceProfile: !Ref EC2InstanceProfile
          ImageId: !Ref ImageId
          InstanceType: !Ref InstanceType
          # SubnetId: !Ref SubnetId
          # SecurityGroupIds:
          #   - !GetAtt SG.GroupId
          NetworkInterfaces:
            - SubnetId: !Ref SubnetId
              AssociatePublicIpAddress: true
              DeviceIndex: '0'
              GroupSet:
                - !GetAtt SG.GroupId
              DeleteOnTermination: true
          UserData:
            Fn::Base64: |
              #!/bin/bash
              yum update -y
              yum install -y httpd
              systemctl start httpd
              systemctl enable httpd
              echo "<h1>Welcome to my website</h1>" > /var/www/html/index.html
  SG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow http to client host
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0