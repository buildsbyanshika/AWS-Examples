AWSTemplateFormatVersion: 2010-09-09
Description: Create a Role for us to assume and create a resource that have to access
# Resources section
Parameters:
  BucketName:
    Type: String
    Default: "sts-fun-bucket-00"
Resources:
  StsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "sts-fun-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - s3.amazonaws.com
              # AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: 
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: "s3access-sts"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: '*'
                Resource: [
                  !Sub "arn:aws:s3:::${BucketName}",
                  !Sub "arn:aws:s3:::${BucketName}/*"
                ]